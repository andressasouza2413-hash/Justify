<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro da Gestão | Justify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--accent:#06b6d4;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--card:#fff;--border:#e2e8f0;--danger:#dc2626;--shadow:0 10px 30px -12px rgba(15,23,42,.18)}
  [data-theme="escuro"]{--bg:#0b1120;--text:#e2e8f0;--muted:#94a3b8;--card:#111c33;--border:#1e293b;--primary-soft:#1e1b4b;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:28px 16px}
  .auth{width:100%;max-width:520px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;justify-content:center;margin-bottom:6px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:24px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:520px){.row{grid-template-columns:1fr}}
  label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
  input,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;margin-bottom:15px}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .btn{width:100%;border:0;cursor:pointer;font:inherit;font-weight:700;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6;cursor:wait}
  .msg{font-size:14px;border-radius:11px;padding:11px 14px;margin-bottom:16px;display:none}
  .msg.err{background:#fef2f2;color:#b91c1c;display:block;border:1px solid #fecaca}
  .msg.ok{background:#f0fdf4;color:#15803d;display:block;border:1px solid #bbf7d0}
  [data-theme="escuro"] .msg.err{background:#450a0a;color:#fca5a5;border-color:#7f1d1d}
  [data-theme="escuro"] .msg.ok{background:#052e16;color:#86efac;border-color:#14532d}
  .links{text-align:center;font-size:14px;color:var(--muted);margin-top:16px}
  .links a{color:var(--primary);font-weight:600}
  .back{display:block;text-align:center;margin-top:12px;color:var(--muted);font-size:13.5px}
  .tag{display:inline-block;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;margin-bottom:14px}
  .codigo{background:var(--bg);border:1px dashed var(--primary);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:18px}
</style>
</head>
<body>
  <form class="auth" id="form">
    <div class="brand"><span class="dot">J</span> Justify</div>
    <p class="sub">Cadastro da Gestão — acesso administrativo</p>
    <div style="text-align:center"><span class="tag">🏫 Gestão</span></div>
    <div class="msg" id="msg"></div>

    <div class="codigo">🔐 O cadastro da gestão exige o <b>código institucional</b> fornecido pela escola. Sem ele não é possível criar este tipo de perfil.</div>

    <label for="nome">Nome completo</label>
    <input id="nome" placeholder="Ex.: Carlos Mendes" required />

    <div class="row">
      <div>
        <label for="cpf">CPF</label>
        <input id="cpf" placeholder="000.000.000-00" inputmode="numeric" required />
      </div>
      <div>
        <label for="cargo">Cargo</label>
        <select id="cargo" required>
          <option value="">Selecione</option>
          <option value="direcao">Direção</option>
          <option value="coordenacao">Coordenação</option>
          <option value="secretaria">Secretaria</option>
          <option value="supervisao">Supervisão</option>
        </select>
      </div>
    </div>

    <label for="email">E-mail</label>
    <input type="email" id="email" placeholder="gestao@escola.com" required autocomplete="email" />

    <div class="row">
      <div>
        <label for="turno">Turno</label>
        <select id="turno" required>
          <option value="">Selecione</option>
          <option value="manha">Manhã</option>
          <option value="tarde">Tarde</option>
          <option value="noite">Noite</option>
          <option value="integral">Integral</option>
        </select>
      </div>
      <div>
        <label for="codigo">Código institucional</label>
        <input id="codigo" placeholder="JUSTIFY-GESTAO" required />
      </div>
    </div>

    <div class="row">
      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Mín. 6 caracteres" required autocomplete="new-password" />
      </div>
      <div>
        <label for="senha2">Confirmar senha</label>
        <input type="password" id="senha2" placeholder="Repita a senha" required autocomplete="new-password" />
      </div>
    </div>

    <button class="btn" id="enviar" type="submit">Criar perfil de gestão</button>

    <div class="links">Já tem conta? <a href="login.html">Entrar</a></div>
    <a class="back" href="../../index.html">← Voltar para a página inicial</a>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ===== CONFIGURAÇÃO SUPABASE (veja instruções em login.html) ===== */
  const SUPABASE_URL = "https://vavtaexniwctxkquuuos.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_gLs2FLF0YM02bsMdQkfAdA_QYt75LB-";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if (localStorage.getItem('justify_tema') === 'escuro') document.documentElement.setAttribute('data-theme','escuro');

  /* Código institucional para liberar cadastro da gestão. Troque conforme a escola. */
  const CODIGO_GESTAO = 'JUSTIFY-GESTAO';

  const msg = document.getElementById('msg');
  const show = (t, tipo) => { msg.textContent = t; msg.className = 'msg ' + tipo; };

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('enviar');
    const nome = document.getElementById('nome').value.trim();
    const cpf = document.getElementById('cpf').value.trim();
    const cargo = document.getElementById('cargo').value;
    const email = document.getElementById('email').value.trim();
    const turno = document.getElementById('turno').value;
    const codigo = document.getElementById('codigo').value.trim();
    const senha = document.getElementById('senha').value;
    const senha2 = document.getElementById('senha2').value;

    if (codigo !== CODIGO_GESTAO) return show('Código institucional inválido.', 'err');
    if (senha.length < 6) return show('A senha deve ter ao menos 6 caracteres.', 'err');
    if (senha !== senha2) return show('As senhas não coincidem.', 'err');

    btn.disabled = true; btn.textContent = 'Criando perfil...'; msg.className = 'msg';
    try {
      const { data, error } = await db.auth.signUp({
        email, password: senha,
        options: { data: { role: 'gestao', nome_completo: nome, cpf } }
      });
      if (error) throw error;
      if (!data.session) {
        show('Cadastro criado! Confirme o e-mail para ativar a conta e depois entre.', 'ok');
        btn.textContent = 'Cadastro enviado';
        return;
      }
      const username = email.split('@')[0] + '-' + data.user.id.slice(0, 4);
      const { error: perr } = await db.from('profiles').update({
        username, turno, bio: 'Gestão • ' + cargo
      }).eq('id', data.user.id);
      if (perr) throw perr;

      show('Perfil de gestão criado com sucesso! Redirecionando...', 'ok');
      setTimeout(() => location.href = 'gestao.html', 900);
    } catch (err) {
      show(err.message || 'Não foi possível concluir o cadastro.', 'err');
      btn.disabled = false; btn.textContent = 'Criar perfil de gestão';
    }
  });
</script>
</body>
</html>
