<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Criar Aviso | Justify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--accent:#06b6d4;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--card:#fff;--border:#e2e8f0;--danger:#dc2626;--shadow:0 8px 24px -14px rgba(15,23,42,.25)}
  [data-theme="escuro"]{--bg:#0b1120;--text:#e2e8f0;--muted:#94a3b8;--card:#111c33;--border:#1e293b;--primary-soft:#1e1b4b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  a{color:inherit;text-decoration:none}
  .topbar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
  .topbar-in{max-width:860px;margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
  .brand .dot{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff}
  .container{max-width:860px;margin:0 auto;padding:26px 22px 70px}
  h1{font-size:23px;margin-bottom:4px}.sub{color:var(--muted);margin-bottom:22px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px}
  .btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:11px 18px;border-radius:11px;background:var(--primary);color:#fff;display:inline-flex;gap:8px;align-items:center;font-size:14px}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6}
  .btn.light{background:var(--card);color:var(--text);border:1px solid var(--border)}
  label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
  input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  textarea{min-height:130px;resize:vertical}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .msg{font-size:14px;border-radius:11px;padding:11px 14px;margin-top:16px;display:none}
  .msg.err{background:#fef2f2;color:#b91c1c;display:block}
  .msg.ok{background:#f0fdf4;color:#15803d;display:block}
  .req{color:var(--danger)}
  .preview{margin-top:24px;border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--bg);display:none}
  .preview h3{font-size:16px;margin-bottom:8px;color:var(--primary)}
  .preview p{font-size:14px;color:var(--muted);white-space:pre-wrap}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="brand" href="professor.html"><span class="dot">J</span> Justify</a>
  <a class="btn light" id="voltar">← Voltar</a>
</div></div>

<div class="container">
  <h1>📣 Criar e publicar aviso</h1>
  <p class="sub">O aviso será enviado como notificação para os destinatários escolhidos.</p>

  <div class="card">
    <label for="titulo">Nome do aviso <span class="req">*</span></label>
    <input id="titulo" placeholder="Ex.: Reunião de pais e mestres" required />

    <label for="assunto">Assunto <span class="req">*</span></label>
    <textarea id="assunto" placeholder="Descreva o conteúdo do aviso..." required></textarea>

    <div class="grid">
      <div>
        <label for="dest">Destinatários</label>
        <select id="dest">
          <option value="todos">Todos</option>
          <option value="aluno">Somente alunos</option>
          <option value="professor">Somente professores</option>
        </select>
      </div>
      <div>
        <label for="turma">Turma (opcional)</label>
        <input id="turma" placeholder="Ex.: 2ºB — deixe vazio para todas" />
      </div>
    </div>

    <div class="grid">
      <div>
        <label for="turno">Turno (opcional)</label>
        <select id="turno">
          <option value="">Todos os turnos</option>
          <option value="manha">Manhã</option><option value="tarde">Tarde</option>
          <option value="noite">Noite</option><option value="integral">Integral</option>
        </select>
      </div>
      <div>
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="info">Informativo</option>
          <option value="urgente">Urgente</option>
          <option value="evento">Evento</option>
        </select>
      </div>
    </div>

    <div style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="publicar">Publicar aviso</button>
      <button class="btn light" id="previsualizar" type="button">Pré-visualizar</button>
    </div>
    <div class="msg" id="msg"></div>

    <div class="preview" id="preview">
      <h3 id="pvt"></h3>
      <p id="pva"></p>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vavtaexniwctxkquuuos.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_gLs2FLF0YM02bsMdQkfAdA_QYt75LB-";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if (localStorage.getItem('justify_tema') === 'escuro') document.documentElement.setAttribute('data-theme','escuro');

  const $ = (id) => document.getElementById(id);
  let eu=null, perfil=null;
  const show=(t,c)=>{ const m=$('msg'); m.textContent=t; m.className='msg '+c; };

  (async function init(){
    const { data:{ user } } = await db.auth.getUser();
    if(!user) return location.href='login.html';
    eu=user;
    const { data } = await db.from('profiles').select('*').eq('id',user.id).single();
    if(!data || (data.role!=='professor' && data.role!=='gestao')) return location.href='login.html';
    perfil=data;
    $('voltar').href = data.role==='gestao' ? 'gestao.html' : 'professor.html';
  })();

  $('previsualizar').onclick = () => {
    if(!$('titulo').value.trim()) return show('Informe o nome do aviso.', 'err');
    $('pvt').textContent = $('titulo').value;
    $('pva').textContent = $('assunto').value || '(sem conteúdo)';
    $('preview').style.display='block';
  };

  $('publicar').onclick = async () => {
    const btn=$('publicar');
    const titulo=$('titulo').value.trim();
    const assunto=$('assunto').value.trim();
    if(!titulo) return show('O nome do aviso é obrigatório.', 'err');
    if(!assunto) return show('O assunto é obrigatório.', 'err');
    btn.disabled=true; btn.textContent='Publicando...';
    try{
      const { error } = await db.from('avisos').insert({
        autor_id: eu.id, autor_nome: perfil.nome_completo,
        titulo, assunto,
        turma: $('turma').value.trim() || null,
        turno: $('turno').value || null,
        destinatario_role: $('dest').value
      });
      if(error) throw error;

      // notificacao broadcast
      await db.from('notificacoes').insert({
        destinatario_role: $('dest').value === 'todos' ? null : $('dest').value,
        titulo, mensagem: assunto, tipo: $('tipo').value
      });

      show('Aviso publicado com sucesso!', 'ok');
      $('titulo').value=''; $('assunto').value=''; $('preview').style.display='none';
    }catch(err){
      show(err.message||'Erro ao publicar aviso.', 'err');
    }finally{
      btn.disabled=false; btn.textContent='Publicar aviso';
    }
  };
</script>
</body>
</html>
