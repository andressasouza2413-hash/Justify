<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha | Justify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--accent:#06b6d4;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--card:#fff;--border:#e2e8f0;--shadow:0 10px 30px -12px rgba(15,23,42,.18)}
  [data-theme="escuro"]{--bg:#0b1120;--text:#e2e8f0;--muted:#94a3b8;--card:#111c33;--border:#1e293b;--primary-soft:#1e1b4b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
  .auth{width:100%;max-width:430px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:34px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;justify-content:center;margin-bottom:6px}
  .brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff}
  .sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:26px}
  label{display:block;font-size:13.5px;font-weight:600;margin:0 0 6px}
  input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:15px;margin-bottom:16px}
  input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .btn{width:100%;border:0;cursor:pointer;font:inherit;font-weight:700;padding:13px;border-radius:12px;background:var(--primary);color:#fff;font-size:15px}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6}
  .msg{font-size:14px;border-radius:11px;padding:11px 14px;margin-bottom:16px;display:none}
  .msg.err{background:#fef2f2;color:#b91c1c;display:block}
  .msg.ok{background:#f0fdf4;color:#15803d;display:block}
  .back{display:block;text-align:center;margin-top:14px;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
  <form class="auth" id="form">
    <div class="brand"><span class="dot">J</span> Justify</div>
    <p class="sub">Defina uma nova senha para sua conta</p>
    <div class="msg" id="msg"></div>
    <label for="senha">Nova senha</label>
    <input type="password" id="senha" placeholder="Mín. 6 caracteres" required autocomplete="new-password" />
    <label for="senha2">Confirmar nova senha</label>
    <input type="password" id="senha2" placeholder="Repita a senha" required autocomplete="new-password" />
    <button class="btn" id="enviar" type="submit">Redefinir senha</button>
    <a class="back" href="login.html">← Voltar para o login</a>
  </form>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vavtaexniwctxkquuuos.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_gLs2FLF0YM02bsMdQkfAdA_QYt75LB-";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if (localStorage.getItem('justify_tema') === 'escuro') document.documentElement.setAttribute('data-theme','escuro');
  const $ = (id) => document.getElementById(id);
  const show=(t,c)=>{ const m=$('msg'); m.textContent=t; m.className='msg '+c; };

  db.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') show('Link válido. Defina sua nova senha.', 'ok');
  });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const a = $('senha').value, b = $('senha2').value;
    if (a.length < 6) return show('A senha deve ter ao menos 6 caracteres.', 'err');
    if (a !== b) return show('As senhas não coincidem.', 'err');
    const btn=$('enviar'); btn.disabled=true; btn.textContent='Salvando...';
    const { error } = await db.auth.updateUser({ password: a });
    if (error) { show(error.message, 'err'); btn.disabled=false; btn.textContent='Redefinir senha'; return; }
    show('Senha redefinida com sucesso! Redirecionando...', 'ok');
    setTimeout(() => location.href = 'login.html', 1200);
  });
</script>
</body>
</html>
