<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Perfil do Aluno | Justify</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--primary:#4f46e5;--primary-dark:#4338ca;--primary-soft:#eef2ff;--accent:#06b6d4;--bg:#f8fafc;--text:#0f172a;--muted:#64748b;--card:#fff;--border:#e2e8f0;--shadow:0 8px 24px -14px rgba(15,23,42,.25)}
  [data-theme="escuro"]{--bg:#0b1120;--text:#e2e8f0;--muted:#94a3b8;--card:#111c33;--border:#1e293b;--primary-soft:#1e1b4b;--shadow:0 8px 24px -14px rgba(0,0,0,.6)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text)}
  a{color:inherit;text-decoration:none}
  .topbar{background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
  .topbar-in{max-width:1000px;margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
  .brand .dot{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--accent));display:grid;place-items:center;color:#fff}
  .container{max-width:1000px;margin:0 auto;padding:26px 22px 70px}
  .btn{border:0;cursor:pointer;font:inherit;font-weight:600;padding:10px 16px;border-radius:11px;background:var(--primary);color:#fff;display:inline-flex;gap:8px;align-items:center;font-size:14px}
  .btn:hover{background:var(--primary-dark)} .btn:disabled{opacity:.6}
  .btn.light{background:var(--card);color:var(--text);border:1px solid var(--border)}
  .btn.light:hover{border-color:var(--primary);color:var(--primary)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin-bottom:22px}
  .prof-head{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .avatar{width:92px;height:92px;border-radius:50%;background:var(--primary-soft);display:grid;place-items:center;font-size:36px;font-weight:800;color:var(--primary);overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover}
  h1{font-size:22px} .muted{color:var(--muted);font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:13.5px;font-weight:600;margin:16px 0 6px}
  input,select{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);font:inherit;font-size:15px}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase}
  tr:last-child td{border-bottom:0}
  .empty{color:var(--muted);font-size:14px;padding:14px 0;text-align:center}
  .notif{border-left:3px solid var(--primary);background:var(--bg);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .notif b{font-size:14px} .notif p{font-size:13.5px;color:var(--muted);margin-top:3px} .notif time{font-size:11.5px;color:var(--muted)}
  .toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--text);color:var(--card);padding:11px 18px;border-radius:12px;font-size:14px;z-index:99;display:none}
  h2{font-size:17px;margin-bottom:14px}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="brand" href="aluno.html"><span class="dot">J</span> Justify</a>
  <a class="btn light" href="aluno.html">← Painel</a>
</div></div>

<div class="container">
  <div class="card">
    <div class="prof-head">
      <div class="avatar" id="avatar">?</div>
      <div>
        <h1 id="nome">...</h1>
        <p class="muted" id="bio">Aluno</p>
        <input type="file" id="foto" accept="image/*" style="margin-top:12px;font-size:13px" />
      </div>
    </div>

    <div class="grid">
      <div><label for="username">Username</label><input id="username" placeholder="ex: joao.pedro" /></div>
      <div><label for="turno">Turno</label>
        <select id="turno">
          <option value="">Selecione</option>
          <option value="manha">Manhã</option><option value="tarde">Tarde</option>
          <option value="noite">Noite</option><option value="integral">Integral</option>
        </select>
      </div>
    </div>
    <label for="bioInput">Bio</label>
    <input id="bioInput" placeholder="Ex.: 2º ano • Turma B" />
    <div class="grid">
      <div><label for="serie">Série</label><input id="serie" placeholder="Ex.: 2º ano" /></div>
      <div><label for="turma">Turma</label><input id="turma" placeholder="Ex.: B" /></div>
    </div>

    <div style="margin-top:22px"><button class="btn" id="salvar">Salvar alterações</button></div>
  </div>

  <div class="card">
    <h2>🔔 Avisos e notificações do dia <span class="muted" id="turnoTag"></span></h2>
    <div id="avisos"><p class="empty">Carregando...</p></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://vavtaexniwctxkquuuos.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_gLs2FLF0YM02bsMdQkfAdA_QYt75LB-";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  if (localStorage.getItem('justify_tema') === 'escuro') document.documentElement.setAttribute('data-theme','escuro');

  const $ = (id) => document.getElementById(id);
  const toast = (t) => { const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',2600); };
  const esc = (s)=> (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=(d)=> d?new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
  let eu=null, perfil=null;

  (async function init(){
    const { data:{ user } } = await db.auth.getUser();
    if(!user) return location.href='login.html';
    eu=user;
    const { data } = await db.from('profiles').select('*').eq('id',user.id).single();
    if(!data || data.role!=='aluno') return location.href='login.html';
    perfil=data;
    $('nome').textContent = perfil.nome_completo || 'Aluno';
    $('bio').textContent = perfil.bio || 'Aluno';
    $('turnoTag').textContent = perfil.turno ? '('+perfil.turno+')' : '';
    $('username').value = perfil.username || '';
    $('bioInput').value = perfil.bio || '';
    $('turno').value = perfil.turno || '';
    $('serie').value = perfil.serie || '';
    $('turma').value = perfil.turma || '';
    mostrarAvatar(perfil.avatar_url);
    await carregarAvisos();
  })();

  function mostrarAvatar(url){
    $('avatar').innerHTML = url ? `<img src="${url}" alt="avatar"/>` : (perfil.nome_completo||'?')[0].toUpperCase();
  }

  $('foto').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    toast('Enviando foto...');
    const path = `${eu.id}/avatar-${Date.now()}.${file.name.split('.').pop()}`;
    const { error } = await db.storage.from('avatars').upload(path, file, { upsert:true });
    if(error) return toast(error.message);
    const { data } = db.storage.from('avatars').getPublicUrl(path);
    await db.from('profiles').update({ avatar_url: data.publicUrl }).eq('id', eu.id);
    perfil.avatar_url = data.publicUrl;
    mostrarAvatar(data.publicUrl);
    toast('Foto atualizada!');
  });

  $('salvar').onclick = async () => {
    const serie = $('serie').value.trim(), turma = $('turma').value.trim();
    const { error } = await db.from('profiles').update({
      username: $('username').value.trim() || null,
      bio: $('bioInput').value.trim(),
      turno: $('turno').value || null,
      serie, turma, updated_at: new Date().toISOString()
    }).eq('id', eu.id);
    if(error) return toast(error.message);
    $('bio').textContent = $('bioInput').value || 'Aluno';
    perfil.serie=serie; perfil.turma=turma; perfil.turno=$('turno').value;
    toast('Perfil atualizado!');
    carregarAvisos();
  };

  async function carregarAvisos(){
    const { data } = await db.from('avisos').select('*').order('created_at',{ascending:false}).limit(40);
    const rel = (data||[]).filter(a => {
      const roleOk = !a.destinatario_role || a.destinatario_role === 'todos' || a.destinatario_role === 'aluno';
      const turmaOk = !a.turma || a.turma === perfil.turma;
      const turnoOk = !a.turno || !perfil.turno || a.turno === perfil.turno;
      return roleOk && turmaOk && turnoOk;
    }).slice(0,20);
    const box=$('avisos');
    if(!rel.length){ box.innerHTML='<p class="empty">Nenhum aviso para o seu turno hoje.</p>'; return; }
    box.innerHTML = rel.map(a=>`
      <div class="notif"><b>${esc(a.titulo)}</b><p>${esc(a.assunto||'')}</p>
      <time>${fmt(a.created_at)} ${a.autor_nome?'• '+esc(a.autor_nome):''} ${a.turno?'• '+a.turno:''}</time></div>`).join('');
  }
</script>
</body>
</html>
